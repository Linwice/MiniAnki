<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Anki</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="app-shell">
      <section id="review-view" class="review-view">
        <div id="status" class="status" role="status"></div>
        <div id="card-surface" class="card-surface" aria-label="Anki 卡片"></div>
      </section>

      <section id="deck-view" class="panel-view hidden" aria-label="选择牌组">
        <form id="deck-form">
          <label for="deck-select">从 Mac Anki 选择牌组</label>
          <select id="deck-select" size="6" required></select>
          <p id="deck-note">Mac 只需保持 Anki 运行，无需手动进入复习。</p>
          <div class="form-actions">
            <button id="cancel-deck" type="button">取消</button>
            <button type="submit" class="primary">开始复习</button>
          </div>
        </form>
      </section>

    </main>
    <div class="resize-handle north" data-direction="North" aria-hidden="true"></div>
    <div class="resize-handle east" data-direction="East" aria-hidden="true"></div>
    <div class="resize-handle south" data-direction="South" aria-hidden="true"></div>
    <div class="resize-handle west" data-direction="West" aria-hidden="true"></div>
    <div class="resize-handle north-east" data-direction="NorthEast" aria-hidden="true"></div>
    <div class="resize-handle north-west" data-direction="NorthWest" aria-hidden="true"></div>
    <div class="resize-handle south-east" data-direction="SouthEast" aria-hidden="true"></div>
    <div class="resize-handle south-west" data-direction="SouthWest" aria-hidden="true"></div>
  </body>
</html>
